name = "wekit-read-receipts-cf-workers"
main = "worker.js"
compatibility_date = "2025-01-01"

# D1 绑定：不填 database_id，首次部署时自动创建并绑定
# （Automatic provisioning，需 Wrangler ≥ 4.45.0；ID 仅存于 dashboard，不写回仓库）
[[d1_databases]]
binding = "DB"
database_name = "read-receipts"

# 定时清理过期会话（及可选的数据保留策略 RETENTION_DAYS）
[triggers]
crons = ["0 3 * * *"]
